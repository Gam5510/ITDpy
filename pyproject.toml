[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "itdpy"
version = "1.0.5"
description = "Production-ready Python SDK for ITD API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Gam5510" }
]

dependencies = [
  "requests>=2.28.0",
  "pydantic>=2.0.0",
  "sseclient-py>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/Gam5510/ITDpy"
Repository = "https://github.com/Gam5510/ITDpy"
