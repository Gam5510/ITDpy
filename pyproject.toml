[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itdpy"
version = "1.2.1"
description = "Production-ready Python SDK for the ITD platform API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
browser-login = [
    "DrissionPage>=4.0.0",
    "pyvirtualdisplay; platform_system == 'Linux'",
]

[tool.hatch.build.targets.wheel]
packages = ["itdpy"]
